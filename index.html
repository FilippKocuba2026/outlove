<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OutLove • v5 Performance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background: #0a0a0f; color: white; }
        .glass { background: rgba(255,255,255,0.08); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.12); }
        .swipe-card { transition: transform 0.08s linear; touch-action: none; }
        .nav-active { color: #c026d3; }
        .message { transition: opacity 0.2s ease; }
    </style>
</head>
<body class="bg-[#0a0a0f] text-white max-w-md mx-auto">

    <!-- AUTH -->
    <div id="auth-screen" class="min-h-screen flex flex-col justify-center px-6">
        <div class="text-center mb-10">
            <h1 class="text-7xl font-extrabold tracking-[-3px]">OutLove</h1>
            <p class="text-emerald-400 text-sm mt-1">v5 • Performance Optimized</p>
        </div>
        <div class="glass p-7 rounded-3xl">
            <button onclick="simulateLogin()" class="w-full py-4 bg-gradient-to-r from-purple-600 to-pink-600 rounded-2xl font-semibold mb-3">Войти</button>
            <button onclick="showRegistrationForm()" class="w-full py-4 border border-white/30 rounded-2xl">Создать аккаунт</button>
        </div>
    </div>

    <!-- APP -->
    <div id="main-app" class="hidden">
        <div class="sticky top-0 z-50 bg-[#0a0a0f]/95 backdrop-blur-xl border-b border-white/10 px-5 py-4 flex items-center">
            <div onclick="openSideMenu()">
                <img id="profile-avatar" src="https://picsum.photos/id/64/36/36" class="w-9 h-9 rounded-full ring-2 ring-purple-400 object-cover">
            </div>
            <div class="flex-1 text-center font-bold text-3xl tracking-tighter">OutLove</div>
            <div onclick="showNotifications()"><i class="fa-solid fa-bell text-2xl"></i></div>
        </div>

        <div id="main-content" class="pb-20"></div>

        <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#0a0a0f] border-t border-white/10 py-2">
            <div class="flex justify-around text-xs">
                <div onclick="switchTab('feed')" class="tab-btn flex flex-col items-center cursor-pointer" data-tab="feed"><i class="fa-solid fa-home text-2xl"></i><span>Лента</span></div>
                <div onclick="switchTab('search')" class="tab-btn flex flex-col items-center cursor-pointer" data-tab="search"><i class="fa-solid fa-search text-2xl"></i><span>Поиск</span></div>
                <div onclick="switchTab('messages')" class="tab-btn flex flex-col items-center cursor-pointer" data-tab="messages"><i class="fa-solid fa-comments text-2xl"></i><span>Чат</span></div>
                <div onclick="renderAILoveCoach()" class="tab-btn flex flex-col items-center cursor-pointer"><i class="fa-solid fa-robot text-2xl"></i><span>AI</span></div>
            </div>
        </div>
    </div>

    <script>
        // ==================== STATE ====================
        let currentUser = JSON.parse(localStorage.getItem('currentUser')) || { name: "Ты", age: 28, city: "Москва", avatar: "https://picsum.photos/id/64/36/36" };
        let likes = JSON.parse(localStorage.getItem('likes')) || [];
        let matches = JSON.parse(localStorage.getItem('matches')) || [];
        let chatMessages = JSON.parse(localStorage.getItem('chatMessages')) || {};
        let currentChatUser = null;
        let aiConversation = JSON.parse(localStorage.getItem('aiConversation')) || [];
        let currentSwipeIndex = 0;
        let isProcessingSwipe = false;

        const fakeUsers = [
            { id: 1, name: "Анна Морозова", age: 26, city: "Москва", distance: 3, photo: "https://picsum.photos/id/64/400/500", bio: "Люблю путешествия и глубокие разговоры" },
            { id: 2, name: "Дмитрий Соколов", age: 29, city: "Санкт-Петербург", distance: 12, photo: "https://picsum.photos/id/65/400/500", bio: "Программист и гитарист" },
            { id: 3, name: "София Волкова", age: 24, city: "Москва", distance: 5, photo: "https://picsum.photos/id/66/400/500", bio: "Художница" }
        ];

        function saveData() {
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            localStorage.setItem('likes', JSON.stringify(likes));
            localStorage.setItem('matches', JSON.stringify(matches));
            localStorage.setItem('chatMessages', JSON.stringify(chatMessages));
            localStorage.setItem('aiConversation', JSON.stringify(aiConversation));
        }

        function updateProfileUI() {
            const avatar = document.getElementById('profile-avatar');
            if (avatar) avatar.src = currentUser.avatar;
        }

        function simulateLogin() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-app').classList.remove('hidden');
            updateProfileUI();
            switchTab('feed');
        }

        function showRegistrationForm() {
            const auth = document.getElementById('auth-screen');
            auth.innerHTML = `
                <div class="px-6 py-8">
                    <button onclick="location.reload()" class="mb-6 text-2xl">←</button>
                    <h2 class="text-2xl font-bold mb-6">Регистрация</h2>
                    <input id="reg-name" placeholder="Имя" class="w-full bg-zinc-900 p-4 rounded-2xl mb-3">
                    <input id="reg-age" type="number" placeholder="Возраст" class="w-full bg-zinc-900 p-4 rounded-2xl mb-3">
                    <input id="reg-city" placeholder="Город" class="w-full bg-zinc-900 p-4 rounded-2xl mb-6">
                    <button onclick="completeRegistration()" class="w-full py-4 bg-gradient-to-r from-purple-600 to-pink-600 rounded-2xl font-semibold">Создать аккаунт</button>
                </div>`;
        }

        function completeRegistration() {
            currentUser.name = document.getElementById('reg-name').value || "Пользователь";
            currentUser.age = parseInt(document.getElementById('reg-age').value) || 25;
            currentUser.city = document.getElementById('reg-city').value || "Москва";
            saveData();
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-app').classList.remove('hidden');
            updateProfileUI();
            switchTab('feed');
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('nav-active'));
            const btn = document.querySelector(`[data-tab="${tab}"]`);
            if (btn) btn.classList.add('nav-active');
            renderContent(tab);
        }

        function renderContent(tab) {
            const container = document.getElementById('main-content');
            container.innerHTML = '';

            if (tab === 'feed') {
                container.innerHTML = `<div class="p-5"><h2 class="text-2xl font-semibold mb-4">Лента</h2><div class="glass p-5 rounded-3xl">OutLove v5 — Performance версия</div></div>`;
            } else if (tab === 'search') {
                container.innerHTML = `
                    <div class="p-5">
                        <div id="swipe-container" class="relative h-[480px] flex justify-center"></div>
                        <div class="flex justify-center gap-8 mt-6">
                            <button onclick="passUser()" class="w-16 h-16 bg-zinc-800 rounded-full text-3xl active:scale-95"><i class="fa-solid fa-times"></i></button>
                            <button onclick="likeUser()" class="w-16 h-16 bg-gradient-to-br from-pink-500 to-red-500 rounded-full text-3xl text-white active:scale-95"><i class="fa-solid fa-heart"></i></button>
                        </div>
                    </div>`;
                setTimeout(renderSwipeCards, 80);
            } else if (tab === 'messages') {
                renderMessagesList(container);
            }
        }

        // ==================== PERFORMANCE SWIPE ====================
        function renderSwipeCards() {
            const container = document.getElementById('swipe-container');
            if (!container) return;
            container.innerHTML = '';

            if (currentSwipeIndex >= fakeUsers.length) currentSwipeIndex = 0;
            const user = fakeUsers[currentSwipeIndex];

            const card = document.createElement('div');
            card.className = `swipe-card w-full max-w-[340px] bg-zinc-900 rounded-3xl overflow-hidden shadow-2xl cursor-grab`;
            
            card.innerHTML = `
                <img src="${user.photo}" class="w-full h-[420px] object-cover" draggable="false">
                <div class="p-5">
                    <div class="flex justify-between items-end">
                        <div><span class="text-3xl font-bold">${user.name}</span><span class="text-2xl text-zinc-400 ml-2">${user.age}</span></div>
                        <div class="text-right text-sm text-zinc-400">${user.city} • ${user.distance} км</div>
                    </div>
                    <p class="mt-3 text-sm text-zinc-300">${user.bio}</p>
                </div>
            `;

            let startX = 0;
            let currentX = 0;

            const onStart = (e) => {
                if (isProcessingSwipe) return;
                isDragging = true;
                startX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                card.style.transition = 'none';
            };

            const onMove = (e) => {
                if (!isDragging || isProcessingSwipe) return;
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                currentX = clientX - startX;
                const rotation = currentX / 14;
                card.style.transform = `translateX(${currentX}px) rotate(${rotation}deg)`;
            };

            const onEnd = () => {
                if (!isDragging || isProcessingSwipe) return;
                isDragging = false;
                card.style.transition = 'transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1)';

                if (currentX > 110) {
                    isProcessingSwipe = true;
                    card.style.transform = `translateX(600px) rotate(35deg)`;
                    setTimeout(() => { likeUser(); isProcessingSwipe = false; }, 280);
                } else if (currentX < -110) {
                    isProcessingSwipe = true;
                    card.style.transform = `translateX(-600px) rotate(-35deg)`;
                    setTimeout(() => { passUser(); isProcessingSwipe = false; }, 280);
                } else {
                    card.style.transform = `translateX(0) rotate(0)`;
                }
                currentX = 0;
            };

            card.addEventListener('mousedown', onStart);
            card.addEventListener('mousemove', onMove);
            card.addEventListener('mouseup', onEnd);
            card.addEventListener('mouseleave', onEnd);
            card.addEventListener('touchstart', onStart, { passive: true });
            card.addEventListener('touchmove', onMove, { passive: true });
            card.addEventListener('touchend', onEnd);

            container.appendChild(card);
        }

        function likeUser() {
            if (isProcessingSwipe) return;
            const user = fakeUsers[currentSwipeIndex];
            if (!user) return;

            if (!likes.includes(user.id)) likes.push(user.id);

            if (Math.random() < 0.5 && !matches.find(m => m.id === user.id)) {
                matches.push(user);
                showMatchPopup(user);
            } else {
                showToast(`❤️ ${user.name}`);
                nextSwipeCard();
            }
            saveData();
        }

        function passUser() {
            if (isProcessingSwipe) return;
            showToast("Пропущено");
            nextSwipeCard();
        }

        function nextSwipeCard() {
            currentSwipeIndex = (currentSwipeIndex + 1) % fakeUsers.length;
            setTimeout(() => {
                const c = document.getElementById('swipe-container');
                if (c) renderSwipeCards();
            }, 40);
        }

        function showMatchPopup(user) {
            const popup = document.createElement('div');
            popup.className = 'fixed inset-0 bg-black/90 flex items-center justify-center z-[99999]';
            popup.innerHTML = `
                <div class="text-center px-6">
                    <div class="text-7xl mb-4">🎉</div>
                    <h2 class="text-4xl font-bold mb-2">Это матч!</h2>
                    <div class="flex justify-center gap-4 my-6">
                        <img src="${currentUser.avatar}" class="w-20 h-20 rounded-2xl ring-4 ring-purple-500">
                        <img src="${user.photo}" class="w-20 h-20 rounded-2xl ring-4 ring-pink-500">
                    </div>
                    <div class="flex gap-3">
                        <button onclick="startChat(${user.id}); this.closest('.fixed').remove()" class="flex-1 py-3 bg-white text-black rounded-2xl font-semibold">Написать</button>
                        <button onclick="this.closest('.fixed').remove(); nextSwipeCard()" class="flex-1 py-3 border border-white/40 rounded-2xl">Продолжить</button>
                    </div>
                </div>`;
            document.body.appendChild(popup);
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'fixed bottom-24 left-1/2 -translate-x-1/2 bg-zinc-800 px-5 py-3 rounded-2xl z-[99999] text-sm';
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 1500);
        }

        // ==================== CHAT ====================
        function renderMessagesList(container) {
            if (matches.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-zinc-400">Пока нет матчей</div>`;
                return;
            }
            let html = `<div class="p-5"><h2 class="text-2xl font-semibold mb-4">Чаты</h2>`;
            matches.forEach(u => {
                html += `<div onclick="startChat(${u.id})" class="glass p-4 mb-3 rounded-3xl flex gap-4 cursor-pointer"><img src="${u.photo}" class="w-12 h-12 rounded-2xl"><div class="font-semibold">${u.name}</div></div>`;
            });
            container.innerHTML = html + `</div>`;
        }

        function startChat(userId) {
            currentChatUser = matches.find(u => u.id === userId);
            if (!currentChatUser) return;

            const container = document.getElementById('main-content');
            container.innerHTML = `
                <div>
                    <div class="px-4 py-3 border-b flex items-center gap-3">
                        <button onclick="switchTab('messages')" class="text-2xl">←</button>
                        <img src="${currentChatUser.photo}" class="w-10 h-10 rounded-full">
                        <div class="font-semibold">${currentChatUser.name}</div>
                    </div>
                    <div id="chat-messages" class="p-4 h-[55vh] overflow-y-auto"></div>
                    <div class="p-4 flex gap-2 border-t">
                        <input id="chat-input" class="flex-1 bg-zinc-900 rounded-2xl px-4 py-3" placeholder="Сообщение..." onkeypress="if(event.key==='Enter') sendMessage()">
                        <button onclick="sendMessage()" class="bg-purple-600 px-6 rounded-2xl">→</button>
                    </div>
                </div>`;
            renderChatMessagesOptimized();
        }

        function renderChatMessagesOptimized() {
            const container = document.getElementById('chat-messages');
            if (!container || !currentChatUser) return;
            const msgs = chatMessages[currentChatUser.id] || [];
            container.innerHTML = '';

            msgs.forEach(msg => {
                const div = document.createElement('div');
                div.className = msg.fromMe ? 'text-right mb-2' : 'mb-2';
                div.innerHTML = `<span class="inline-block px-4 py-2 rounded-2xl text-sm ${msg.fromMe ? 'bg-purple-600' : 'bg-zinc-800'}">${msg.text}</span>`;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            if (!input || !currentChatUser) return;
            const text = input.value.trim();
            if (!text) return;

            if (!chatMessages[currentChatUser.id]) chatMessages[currentChatUser.id] = [];
            chatMessages[currentChatUser.id].push({ text, fromMe: true });

            const container = document.getElementById('chat-messages');
            if (container) {
                const div = document.createElement('div');
                div.className = 'text-right mb-2';
                div.innerHTML = `<span class="inline-block px-4 py-2 rounded-2xl text-sm bg-purple-600">${text}</span>`;
                container.appendChild(div);
                container.scrollTop = container.scrollHeight;
            }

            saveData();
            input.value = '';

            setTimeout(() => {
                if (!chatMessages[currentChatUser.id]) return;
                const replyText = "Круто! Расскажи ещё 😊";
                chatMessages[currentChatUser.id].push({ text: replyText, fromMe: false });

                if (container) {
                    const div = document.createElement('div');
                    div.className = 'mb-2';
                    div.innerHTML = `<span class="inline-block px-4 py-2 rounded-2xl text-sm bg-zinc-800">${replyText}</span>`;
                    container.appendChild(div);
                    container.scrollTop = container.scrollHeight;
                }
                saveData();
            }, 900);
        }

        // ==================== AI COACH ====================
        function renderAILoveCoach() {
            const container = document.getElementById('main-content');
            container.innerHTML = `
                <div class="p-5">
                    <h2 class="text-2xl font-semibold mb-4">AI Love Coach</h2>
                    <div id="ai-chat" class="h-[48vh] overflow-y-auto glass p-4 rounded-3xl mb-4 text-sm"></div>
                    <div class="flex gap-2">
                        <input id="ai-input" class="flex-1 bg-zinc-900 rounded-2xl px-4 py-3" placeholder="Напиши сообщение..." onkeypress="if(event.key==='Enter') sendToAI()">
                        <button onclick="sendToAI()" class="bg-purple-600 px-6 rounded-2xl">→</button>
                    </div>
                </div>`;
            renderAIChatOptimized();
        }

        function renderAIChatOptimized() {
            const container = document.getElementById('ai-chat');
            if (!container) return;
            container.innerHTML = '';

            aiConversation.forEach(msg => {
                const div = document.createElement('div');
                div.className = `mb-3 ${msg.fromUser ? 'text-right' : ''}`;
                div.innerHTML = `<span class="px-4 py-2 rounded-2xl inline-block text-sm ${msg.fromUser ? 'bg-purple-600' : 'bg-zinc-800'}">${msg.text}</span>`;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        function sendToAI() {
            const input = document.getElementById('ai-input');
            if (!input || !input.value.trim()) return;
            const text = input.value.trim();

            aiConversation.push({ text, fromUser: true });

            const container = document.getElementById('ai-chat');
            if (container) {
                const div = document.createElement('div');
                div.className = 'mb-3 text-right';
                div.innerHTML = `<span class="px-4 py-2 rounded-2xl inline-block text-sm bg-purple-600">${text}</span>`;
                container.appendChild(div);
                container.scrollTop = container.scrollHeight;
            }

            input.value = '';

            setTimeout(() => {
                const reply = getAIResponse(text);
                aiConversation.push({ text: reply, fromUser: false });

                if (container) {
                    const div = document.createElement('div');
                    div.className = 'mb-3';
                    div.innerHTML = `<span class="px-4 py-2 rounded-2xl inline-block text-sm bg-zinc-800">${reply}</span>`;
                    container.appendChild(div);
                    container.scrollTop = container.scrollHeight;
                }
                saveData();
            }, 850);
        }

        function getAIResponse(message) {
            const lower = message.toLowerCase();
            if (lower.includes('не отвечает') || lower.includes('игнор')) return "Если игнорят долго — это сигнал. Лучше двигаться дальше.";
            if (lower.includes('нравится')) return "Отлично! Главное — не дави и дай пространство.";
            if (lower.includes('свидание')) return "Хорошая идея. Предложи что-то простое.";
            return "Понимаю. Расскажи подробнее.";
        }

        function openSideMenu() { alert("Боковое меню"); }
        function showNotifications() { alert("Уведомления"); }

        window.onload = function() {
            updateProfileUI();
            console.log("%c[OutLove v5] Performance version loaded on GitHub", "color:#22c55e");
        };
    </script>
</body>
</html>
